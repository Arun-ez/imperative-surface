name: Publish to npm

on:
  push:
    branches:
      - production

permissions:
  id-token: write
  contents: read      

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Clean package.json
        run: |
          jq 'del(.devDependencies, .scripts)' package.json > temp.json
          mv temp.json package.json  

      - name: Publish to npm
        run: npm publish